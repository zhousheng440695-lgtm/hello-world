name: daily-backtest
on:
  schedule:
    - cron: '0 20 * * 1'   # 每周一 20:00 UTC（=北京时间周一早8点）
  workflow_dispatch:        # 允许手动点按钮触发

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy tushare openpyxl
      - name: Run backtest
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python fundamental_backtest.py
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "auto: update backtest data $(date +%F)" || echo "no changes"
          git push
