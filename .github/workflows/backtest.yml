name: daily-backtest
on:
  schedule:
    - cron: '0 20 * * 1'   # UTC每周一20点，北京时间周二04:00自动执行
  workflow_dispatch:        # 开启手动运行按钮

permissions:
  contents: write  # 允许Action bot提交修改回仓库

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy tushare openpyxl

      - name: Run backtest script
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python "Cross-Sectional Strategy.py"

      - name: Commit & Push JSON results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "🤖 auto update quant data & backtest result" || echo "No new data"
          git push
